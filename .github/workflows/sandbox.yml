# Publishes a review copy of the site to GitHub Pages (the "sandbox").
# It builds the demo version (relative links), so it works under the
# /Crown-Masters-Adventures-Modern-Web-Platform/ sub-path. The committed
# site/ folder (production build) is not touched.
name: Sandbox preview

on:
  push:
    branches: [premium-theme, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build demo site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
